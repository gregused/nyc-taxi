name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: python -m pip install dbt

      - name: Show dbt version
        run: dbt --version

      - name: Cache raw data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: tlc-yellow-2023-06

      - name: Download one month of trip data
        run: python scripts/download_data.py --start 2023-06 --end 2023-06

      - name: dbt build (seeds, models, data tests, unit tests)
        run: dbt build --profiles-dir .